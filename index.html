<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buku Kas — Laba Rugi &amp; Neraca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#123B82">
<meta name="mobile-web-app-capable" content="yes">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* Service worker registration only — kept minimal and pointed at a real
   sw.js file (not a blob: URL) so the installed app keeps working across
   sessions. Silently skipped on file:// or other non-http(s) origins,
   where browsers don't allow Service Worker registration at all. */
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
<style>
  :root{
    --paper:#EEF3FB;
    --paper-dim:#E1EBFA;
    --ink:#0F1E30;
    --ink-soft:#4C6280;
    --ink-faint:#8DA0BB;
    --forest:#123B82;
    --forest-light:#1A52B3;
    --forest-pale:#E3ECFC;
    --gold:#0E7AA6;
    --gold-bg:#DCF0F7;
    --rust:#B23A2E;
    --rust-bg:#FBE4E1;
    --line:#D6E1F3;
    --line-strong:#AFC4E6;
    --card:#FFFFFF;
    --accent2:#17A2B8;
    --radius:5px;
    --shadow:0 1px 2px rgba(15,30,48,.07);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Source Serif 4',serif;font-weight:600;margin:0;color:var(--ink);}
  .num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:var(--gold-bg);}

  /* ---------- layout ---------- */
  #shell{display:block;min-height:100vh;}
  #sidebar{
    position:fixed;top:0;left:0;bottom:0;z-index:30;
    width:216px;background:linear-gradient(185deg,var(--forest) 0%,#0D2E63 100%);color:#EDEAE0;
    display:flex;flex-direction:column;padding:22px 0 16px;
    overflow-y:auto;box-shadow:2px 0 18px rgba(8,20,45,.18);
  }
  #brand{padding:0 20px 20px;border-bottom:1px solid rgba(237,234,224,.14);margin-bottom:10px;}
  #brand .mark{font-family:'Source Serif 4',serif;font-size:19px;font-weight:600;color:#fff;letter-spacing:.2px;}
  #brand .sub{font-size:11.5px;color:#B9C4BC;margin-top:3px;}
  nav{display:flex;flex-direction:column;padding:10px 10px 10px 14px;gap:3px;}
  nav button{
    position:relative;display:flex;align-items:center;gap:10px;background:none;border:none;color:#CBD7EA;
    text-align:left;padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:500;
    transition:background .15s ease, color .15s ease, transform .15s ease;
  }
  nav button svg{flex:none;opacity:.85;}
  nav button:hover{background:rgba(255,255,255,.08);color:#fff;transform:translateX(1px);}
  nav button.active{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);}
  nav button.active::before{
    content:'';position:absolute;left:-10px;top:50%;transform:translateY(-50%);
    width:4px;height:20px;border-radius:0 4px 4px 0;background:var(--accent2);
  }
  nav button.active svg{opacity:1;color:var(--accent2);}
  #sidebar-foot{margin-top:auto;padding:14px 20px 0;border-top:1px solid rgba(237,234,224,.14);}
  #sidebar-foot .yr{font-size:11px;color:#9FB0A6;}

  #main{flex:1;min-width:0;margin-left:216px;padding:28px 34px 60px;max-width:1180px;}
  .topline{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:22px;}
  .topline h1{font-size:23px;}
  .topline .desc{color:var(--ink-soft);font-size:13px;margin-top:4px;}
  .sticky-head{
    position:sticky;top:0;z-index:15;background:var(--paper);
    padding:14px 0 16px;margin:-14px 0 8px;border-bottom:1px solid var(--line);
  }

  .controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  select, .btn, input[type=text], input[type=number]{
    font-family:inherit;font-size:13px;border-radius:var(--radius);
  }
  select{
    border:1px solid var(--line-strong);background:#fff;color:var(--ink);
    padding:7px 10px;
  }
  .btn{
    border:1px solid var(--line-strong);background:#fff;color:var(--ink);
    padding:7px 13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;
    transition:background .12s ease,border-color .12s ease,transform .12s ease,box-shadow .12s ease;
  }
  .btn:hover{background:var(--paper-dim);transform:translateY(-1px);box-shadow:0 3px 10px rgba(15,30,48,.08);}
  .btn.primary{background:var(--forest);border-color:var(--forest);color:#fff;box-shadow:0 2px 8px rgba(18,59,130,.22);}
  .btn.primary:hover{background:var(--forest-light);box-shadow:0 6px 16px rgba(18,59,130,.3);}
  .btn.danger{border-color:var(--rust);color:var(--rust);}
  .btn.danger:hover{background:var(--rust-bg);}
  .btn.ghost{border-color:transparent;background:none;padding:6px 8px;box-shadow:none;}
  .btn.ghost:hover{background:var(--paper-dim);transform:none;box-shadow:none;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn svg{flex:none;}

  .yearnav{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:var(--radius);overflow:hidden;background:#fff;}
  .yearnav button{border:none;background:none;padding:7px 9px;color:var(--ink-soft);}
  .yearnav button:hover{background:var(--paper-dim);color:var(--ink);}
  .yearnav .yrval{padding:0 4px;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13.5px;min-width:44px;text-align:center;}

  /* ---------- cards ---------- */
  .cardrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px;}
  .kpi{
    position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;box-shadow:0 1px 3px rgba(15,30,48,.05);transition:box-shadow .15s ease,transform .15s ease;
  }
  .kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--forest),var(--accent2));}
  .kpi:hover{box-shadow:0 8px 20px rgba(15,30,48,.1);transform:translateY(-2px);}
  .kpi .lbl{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;font-weight:600;}
  .kpi .val{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;margin-top:8px;letter-spacing:-.2px;}
  .kpi .val.pos{color:var(--forest);}
  .kpi .val.neg{color:var(--rust);}
  .kpi .sub{font-size:11.5px;color:var(--ink-faint);margin-top:5px;}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:20px;box-shadow:0 1px 3px rgba(15,30,48,.05);}
  .panel h2{font-size:15px;margin-bottom:14px;}
  .panel .hint{font-size:12px;color:var(--ink-faint);margin-top:10px;}

  /* ---------- tables ---------- */
  table{width:100%;border-collapse:collapse;}
  .table-scroll{
    max-height:66vh;overflow:auto;padding:0 10px 14px 22px;margin:0 10px 10px 0;
    border-radius:0 0 var(--radius) var(--radius);
  }
  .table-scroll::-webkit-scrollbar{width:10px;height:10px;}
  .table-scroll::-webkit-scrollbar-track{background:transparent;}
  .table-scroll::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:20px;border:2px solid #fff;}
  .table-scroll::-webkit-scrollbar-thumb:hover{background:var(--ink-faint);}
  .table-scroll::-webkit-scrollbar-corner{background:transparent;}
  .ledger thead tr{background:var(--forest);}
  .ledger th{
    position:sticky;top:0;z-index:6;background:var(--forest);
    text-align:right;font-size:11px;color:#fff;text-transform:uppercase;letter-spacing:.05em;
    font-weight:700;padding:11px 8px;border-bottom:2px solid var(--forest);white-space:nowrap;
    box-shadow:0 2px 0 rgba(8,20,45,.12);
  }
  .ledger thead tr th:first-child{border-top-left-radius:5px;}
  .ledger thead tr th:last-child{border-top-right-radius:5px;}
  .ledger th:first-child{text-align:left;}
  .ledger td{padding:0;border-bottom:1px solid var(--line);vertical-align:middle;}
  .ledger td.name{text-align:left;padding:9px 8px;font-size:13px;}
  .ledger tbody tr:nth-child(even) td{background:rgba(19,60,130,.025);}
  .ledger tr:hover td{background:var(--paper-dim);}
  .ledger td.name .kind{
    display:inline-block;font-size:9.5px;font-weight:700;color:var(--ink-faint);background:var(--paper-dim);
    border-radius:20px;padding:2px 8px;margin-left:7px;text-transform:uppercase;letter-spacing:.03em;vertical-align:middle;
  }
  .kind-pendapatan{background:#D9F5E7;color:#0E8A5F;}
  .kind-pendapatan_lain{background:#D6F3F0;color:#0E8A86;}
  .kind-biaya{background:#FCEAD2;color:#B4650A;}
  .kind-biaya_lain{background:var(--rust-bg);color:var(--rust);}
  .kind-neraca_debet{background:#EAE1FA;color:#6A3FC7;}
  .kind-neraca_kredit{background:#DCE7FB;color:#2451C4;}
  .ledger td.rowtotal{font-weight:600;}
  .ledger tfoot td{border-top:2px solid var(--ink);border-bottom:none;font-weight:700;padding:10px 8px;background:var(--paper);}
  .ledger input.cell{
    width:100%;border:1px solid transparent;background:none;text-align:right;padding:9px 8px;
    font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink);
  }
  .ledger input.cell:hover{border-color:var(--line-strong);}
  .ledger input.cell:focus{outline:none;border-color:var(--forest);background:#fff;}
  .ledger td.actions{width:64px;white-space:nowrap;text-align:right;padding-right:6px;}
  .ledger td.actions button{opacity:.35;}
  .ledger tr:hover td.actions button{opacity:1;}

  .kindtabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap;}
  .kindtabs button{
    border:1px solid var(--line-strong);background:#fff;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;color:var(--ink-soft);
  }
  .kindtabs button.active{background:var(--forest);border-color:var(--forest);color:#fff;}

  /* ---------- report ---------- */
  .report{max-width:640px;}
  .report .rtitle{text-align:center;margin-bottom:4px;}
  .report .rtitle h2{font-size:18px;}
  .report .rtitle .period{text-align:center;color:var(--ink-soft);font-size:12.5px;margin-bottom:22px;}
  .grp{margin:18px 0 4px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--forest);
    border-bottom:1px solid var(--ink);padding-bottom:5px;}
  .rline{display:flex;justify-content:space-between;padding:5px 2px;font-size:13.5px;border-bottom:1px dotted var(--line);}
  .rline .l{color:var(--ink-soft);}
  .rline .v{font-family:'IBM Plex Mono',monospace;}
  .rline.total{border-bottom:1px solid var(--ink-soft);border-top:1px solid var(--ink-soft);font-weight:700;margin-top:2px;padding:8px 2px;}
  .rline.grand{font-size:16px;font-weight:700;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:12px 2px;margin-top:16px;}
  .rline.grand .v.pos{color:var(--forest);}
  .rline.grand .v.neg{color:var(--rust);}
  .emptynote{color:var(--ink-faint);font-size:12.5px;font-style:italic;padding:4px 2px;}

  .neraca-cols{display:grid;grid-template-columns:1fr 1fr;gap:0 26px;}
  .neraca-cols .side h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--forest);border-bottom:1px solid var(--ink);padding-bottom:6px;margin-bottom:2px;}

  /* ---------- forms ---------- */
  .addrow-form{display:flex;gap:8px;align-items:center;margin-bottom:16px;padding:14px;background:var(--forest-pale);border-radius:var(--radius);flex-wrap:wrap;}
  .addrow-form input[type=text]{flex:1;min-width:180px;border:1px solid var(--line-strong);padding:8px 10px;background:#fff;}
  .addrow-form select{padding:8px 10px;}

  .modal-bg{position:fixed;inset:0;background:rgba(36,31,23,.4);display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal{background:#fff;border-radius:var(--radius);padding:22px 24px;width:340px;box-shadow:0 8px 30px rgba(0,0,0,.2);}
  .modal h3{font-size:15px;margin-bottom:14px;}
  .modal p{font-size:13px;color:var(--ink-soft);margin:0 0 16px;}
  .modal .row-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}

  .empty-state{text-align:center;padding:50px 20px;color:var(--ink-faint);}
  .empty-state h3{color:var(--ink-soft);font-size:16px;margin-bottom:6px;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:10px 18px;border-radius:20px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:100;
    opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  .filedrop{border:1.5px dashed var(--line-strong);border-radius:var(--radius);padding:26px;text-align:center;color:var(--ink-soft);font-size:13px;}
  .filedrop input{display:none;}
  .filedrop label.btn{margin-top:10px;}

  .badge-count{background:var(--gold-bg);color:var(--gold);font-size:10.5px;font-weight:700;border-radius:20px;padding:1px 7px;margin-left:auto;}

  /* ---------- login ---------- */
  #login-screen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#0A2A63 0%,#123B82 45%,#1666C4 100%);
    background-size:200% 200%;
    animation:loginGrad 14s ease infinite;
    position:relative;overflow:hidden;
    padding:20px;
  }
  #login-screen::before, #login-screen::after{
    content:'';position:absolute;border-radius:50%;pointer-events:none;
  }
  #login-screen::before{
    width:520px;height:520px;background:radial-gradient(circle, rgba(23,162,184,.25), transparent 70%);
    top:-180px;left:-160px;
  }
  #login-screen::after{
    width:460px;height:460px;background:radial-gradient(circle, rgba(255,255,255,.08), transparent 70%);
    bottom:-160px;right:-140px;
  }
  @keyframes loginGrad{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }
  .login-card{
    position:relative;z-index:1;
    width:100%;max-width:388px;background:#fff;border-radius:14px;
    padding:0 34px 30px;box-shadow:0 30px 70px rgba(5,20,50,.45);
    overflow:hidden;
  }
  .login-card::before{
    content:'';display:block;height:6px;margin:0 -34px 30px;
    background:linear-gradient(90deg,var(--forest),var(--accent2));
  }
  .login-badge{
    width:68px;height:68px;border-radius:16px;color:#fff;
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;
    box-shadow:0 10px 24px rgba(10,42,99,.35);overflow:hidden;
  }
  .login-badge img{width:100%;height:100%;display:block;object-fit:cover;}
  .login-title{text-align:center;font-family:'Source Serif 4',serif;font-size:23px;font-weight:600;color:var(--ink);}
  .login-sub{text-align:center;font-size:12.5px;color:var(--ink-faint);margin-top:6px;line-height:1.6;}
  .login-form{margin-top:26px;display:flex;flex-direction:column;gap:13px;}
  .login-form label{font-size:11.5px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;margin-bottom:-5px;}
  .login-form input{
    padding:12px 14px;border:1.5px solid var(--line-strong);border-radius:9px;font-size:14.5px;
    background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;transition:border-color .15s ease,box-shadow .15s ease,background .15s ease;
  }
  .login-form input:focus{outline:none;border-color:var(--forest);background:#fff;box-shadow:0 0 0 4px rgba(18,59,130,.12);}
  .login-error{background:var(--rust-bg);color:var(--rust);font-size:12.5px;padding:10px 12px;border-radius:8px;display:none;font-weight:500;}
  .login-error.show{display:block;}
  .login-form .btn{
    width:100%;justify-content:center;padding:12px;font-size:14px;margin-top:6px;border-radius:9px;border:none;
    background:linear-gradient(135deg,var(--forest),var(--forest-light));
    box-shadow:0 10px 22px rgba(18,59,130,.3);transition:transform .12s ease,box-shadow .12s ease;
  }
  .login-form .btn:hover{transform:translateY(-1px);box-shadow:0 14px 26px rgba(18,59,130,.36);}
  .login-switch{text-align:center;font-size:12.5px;color:var(--ink-faint);margin-top:20px;}
  .login-switch a{color:var(--forest);font-weight:600;cursor:pointer;text-decoration:underline;}
  .login-foot{text-align:center;font-size:11px;color:var(--ink-faint);margin-top:22px;padding-top:16px;border-top:1px solid var(--line);}

  /* ---------- mobile top bar & bottom nav (hidden on desktop) ---------- */
  #mobile-topbar{display:none;}
  #mobile-bottomnav{display:none;}

  @media (max-width:820px){
    #sidebar{display:none;}

    #mobile-topbar{
      display:flex;align-items:center;justify-content:space-between;
      position:fixed;top:0;left:0;right:0;height:56px;z-index:40;
      background:linear-gradient(135deg,var(--forest),var(--forest-light));
      padding:0 14px;box-shadow:0 2px 10px rgba(10,42,99,.28);
    }
    #mobile-topbar .mb-brand{display:flex;align-items:center;gap:9px;color:#fff;font-family:'Source Serif 4',serif;font-weight:700;font-size:15.5px;}
    #mobile-topbar .mb-brand img{width:28px;height:28px;border-radius:8px;display:block;}
    #mobile-topbar button{background:rgba(255,255,255,.16);border:none;color:#fff;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
    #mobile-topbar button:active{background:rgba(255,255,255,.28);}

    #mobile-bottomnav{
      display:flex;flex-direction:row;align-items:stretch;gap:0;
      position:fixed;bottom:0;left:0;right:0;height:64px;z-index:40;
      background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(15,30,48,.08);
      padding:0;padding-bottom:env(safe-area-inset-bottom,0);
    }
    #mobile-bottomnav button{
      flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
      background:none;border:none;color:var(--ink-faint);font-size:10px;font-weight:600;padding:6px 2px;
    }
    #mobile-bottomnav button.active{color:var(--forest);}
    #mobile-bottomnav button svg{flex:none;}

    #main{margin-left:0;padding:70px 14px 82px;max-width:none;}
    .sticky-head{top:56px;}
    .table-scroll{max-height:50vh;}
    .neraca-cols{grid-template-columns:1fr;gap:20px 0;}
    .cardrow{grid-template-columns:1fr 1fr;}
  }

  @media (max-width:480px){
    .cardrow{grid-template-columns:1fr;}
    .login-card{padding:0 22px 26px;}
    .login-card::before{margin:0 -22px 26px;}
  }

  /* ---------- bottom sheet (mobile "more" menu) ---------- */
  .sheet-bg{align-items:flex-end !important;}
  .sheet{width:100%;max-width:none;border-radius:18px 18px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0));animation:sheetUp .18s ease;}
  @keyframes sheetUp{from{transform:translateY(24px);opacity:.5;} to{transform:translateY(0);opacity:1;}}
  .sheet-handle{width:36px;height:4px;border-radius:4px;background:var(--line-strong);margin:0 auto 16px;}
  .sheet button.btn{width:100%;justify-content:center;padding:12px;margin-top:8px;}

  /* ---------- print ---------- */
  @media print{
    body{background:#fff;}
    #sidebar, #mobile-topbar, #mobile-bottomnav, .toast, .no-print{display:none !important;}
    #main{padding:0;margin-left:0;max-width:none;}
    .panel{border:none;box-shadow:none;padding:0;}
    .report{max-width:none;}
    .topline{margin-bottom:14px;}
  }
</style>
</head>
<body>
<div id="login-screen" style="display:none;"></div>
<div id="shell" style="display:none;">
  <aside id="sidebar" class="no-print">
    <div id="brand">
      <div class="mark">Buku Kas</div>
      <div class="sub">Laba Rugi &amp; Neraca</div>
    </div>
    <nav id="nav"></nav>
    <div id="sidebar-foot">
      <div class="yr" id="lastsaved">tersimpan otomatis</div>
      <button class="btn ghost" id="btn-manage-users" style="margin-top:10px;color:#D6DED9;border-color:rgba(237,234,224,.25);width:100%;justify-content:center;">Kelola Pengguna</button>
      <button class="btn ghost" id="btn-logout" style="margin-top:8px;color:#D6DED9;border-color:rgba(237,234,224,.25);width:100%;justify-content:center;">Keluar</button>
    </div>

/* Local browser storage — works when this file is opened directly (downloaded
   and run from disk) or hosted anywhere, unlike the Claude-artifact-only
   storage API. Wrapped in try/catch in case storage is blocked (e.g. private
   browsing with storage disabled). */
function localGet(key){
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
function localSet(key, val){
  try{ localStorage.setItem(key, val); return true; }catch(e){ return false; }
}

async function sha256Hex(text){
  try{
    if(window.crypto && window.crypto.subtle && window.isSecureContext !== false){
      const enc = new TextEncoder().encode(text);
      const buf = await crypto.subtle.digest('SHA-256', enc);
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){ /* fall through to non-crypto hash below */ }
  // Fallback hash for contexts without SubtleCrypto (some file:// setups).
  // Not cryptographically strong, but this login is a local access gate,
  // not a security boundary against a determined attacker with the file.
  let h1 = 0, h2 = 0;
  for(let i=0;i<text.length;i++){
    const c = text.charCodeAt(i);
    h1 = (Math.imul(h1,31) + c) >>> 0;
    h2 = (Math.imul(h2,131) + c) >>> 0;
  }
  return h1.toString(16).padStart(8,'0') + h2.toString(16).padStart(8,'0');
}
async function loadAuthList(){
  const raw = localGet(AUTH_KEY);
  if(!raw) return [];
  try{
    const parsed = JSON.parse(raw);
    if(Array.isArray(parsed)) return parsed;
    if(parsed && parsed.username && parsed.hash) return [parsed]; // migrate old single-account format
    return [];
  }catch(e){ return []; }
}
async function saveAuthList(list){
  return localSet(AUTH_KEY, JSON.stringify(list));
}
async function addAuthUser(username, password){
  const list = await loadAuthList();
  if(list.some(u=>u.username.toLowerCase()===username.toLowerCase())) return {ok:false, reason:'duplicate'};
  const hash = await sha256Hex(password);
  list.push({username, hash});
  await saveAuthList(list);
  return {ok:true};
}
async function removeAuthUser(username){
  const list = await loadAuthList();
  const next = list.filter(u=>u.username.toLowerCase()!==username.toLowerCase());
  await saveAuthList(next);
  return next;
}
async function findAuthUser(username, password){
  const list = await loadAuthList();
  const hash = await sha256Hex(password);
  return list.find(u=>u.username.toLowerCase()===username.toLowerCase() && u.hash===hash) || null;
}
async function updateAuthUser(oldUsername, currentPassword, newUsername, newPassword){
  const list = await loadAuthList();
  const idx = list.findIndex(u=>u.username.toLowerCase()===oldUsername.toLowerCase());
  if(idx===-1) return {ok:false, reason:'notfound'};
  const curHash = await sha256Hex(currentPassword);
  if(list[idx].hash !== curHash) return {ok:false, reason:'wrongpassword'};
  if(newUsername.toLowerCase()!==oldUsername.toLowerCase() && list.some((u,i)=> i!==idx && u.username.toLowerCase()===newUsername.toLowerCase())){
    return {ok:false, reason:'duplicate'};
  }
  list[idx].username = newUsername;
  if(newPassword) list[idx].hash = await sha256Hex(newPassword);
  await saveAuthList(list);
  return {ok:true, username:newUsername};
}

function fmtRp(n){
  n = Math.round(n||0);
  const neg = n < 0;
  const s = Math.abs(n).toLocaleString('id-ID');
  return (neg?'-':'') + 'Rp' + s;
}
function fmtNum(n){ return Math.round(n||0).toLocaleString('id-ID'); }
function parseNum(str){
  if(typeof str === 'number') return str;
  const cleaned = (str||'').toString().replace(/[^\d-]/g,'');
  const n = parseInt(cleaned,10);
  return isNaN(n) ? 0 : n;
}

/* =========================================================
   VIEW: RINGKASAN
   ========================================================= */
function viewRingkasan(){
  const main = document.getElementById('main');
  const pend = kindTotal('pendapatan', ui.year, 0, 11);
  const pendLain = kindTotal('pendapatan_lain', ui.year, 0, 11);
  const biaya = kindTotal('biaya', ui.year, 0, 11);
  const biayaLain = kindTotal('biaya_lain', ui.year, 0, 11);
  const laba = (pend+pendLain) - (biaya+biayaLain);
  const margin = (pend+pendLain) > 0 ? (laba/(pend+pendLain)*100) : 0;

  const monthlyPend = [], monthlyBiaya = [];
  for(let m=0;m<12;m++){
    monthlyPend.push(accountsByKind('pendapatan').reduce((s,a)=>s+sumRange(a.id,ui.year,m,m),0) + accountsByKind('pendapatan_lain').reduce((s,a)=>s+sumRange(a.id,ui.year,m,m),0));
    monthlyBiaya.push(accountsByKind('biaya').reduce((s,a)=>s+sumRange(a.id,ui.year,m,m),0) + accountsByKind('biaya_lain').reduce((s,a)=>s+sumRange(a.id,ui.year,m,m),0));
  }
  const maxV = Math.max(1, ...monthlyPend, ...monthlyBiaya);

  const topBiaya = accountsByKind('biaya').concat(accountsByKind('biaya_lain'))
    .map(a=>({name:a.name, total: sumRange(a.id,ui.year,0,11)}))
    .filter(x=>x.total>0)
    .sort((a,b)=>b.total-a.total).slice(0,6);

  main.innerHTML = `
    <div class="topline">
      <div><h1>Ringkasan</h1><div class="desc">Ikhtisar keuangan tahun berjalan</div></div>
      ${yearSwitcher()}
    </div>

    <div class="cardrow">
      <div class="kpi"><div class="lbl">Total Pendapatan</div><div class="val pos">${fmtRp(pend+pendLain)}</div><div class="sub">${state.accounts.filter(a=>a.kind==='pendapatan'||a.kind==='pendapatan_lain').length} akun pendapatan</div></div>
      <div class="kpi"><div class="lbl">Total Biaya</div><div class="val neg">${fmtRp(biaya+biayaLain)}</div><div class="sub">${state.accounts.filter(a=>a.kind==='biaya'||a.kind==='biaya_lain').length} akun biaya</div></div>
      <div class="kpi"><div class="lbl">Laba / Rugi Bersih</div><div class="val ${laba>=0?'pos':'neg'}">${fmtRp(laba)}</div><div class="sub">Tahun ${ui.year}</div></div>
      <div class="kpi"><div class="lbl">Margin Laba</div><div class="val ${margin>=0?'pos':'neg'}">${margin.toFixed(1)}%</div><div class="sub">dari total pendapatan</div></div>
    </div>

    <div class="panel">
      <h2>Pendapatan vs Biaya per Bulan</h2>
      <svg viewBox="0 0 760 220" width="100%" height="220" style="overflow:visible">
        ${MONTHS.map((m,i)=>{
          const x = 20 + i*62;
          const hP = (monthlyPend[i]/maxV)*160;
          const hB = (monthlyBiaya[i]/maxV)*160;
          return `
            <rect x="${x}" y="${180-hP}" width="18" height="${hP}" fill="var(--forest)" rx="1"></rect>
            <rect x="${x+20}" y="${180-hB}" width="18" height="${hB}" fill="var(--rust-bg)" stroke="var(--rust)" stroke-width="1" rx="1"></rect>
            <text x="${x+19}" y="200" font-size="10" fill="var(--ink-faint)" text-anchor="middle" font-family="Inter,sans-serif">${m}</text>
          `;
        }).join('')}
        <line x1="14" y1="180" x2="750" y2="180" stroke="var(--ink)" stroke-width="1.2"></line>
      </svg>
      <div style="display:flex;gap:18px;margin-top:6px;font-size:11.5px;color:var(--ink-soft)">
        <span><span style="display:inline-block;width:9px;height:9px;background:var(--forest);border-radius:1px;margin-right:5px;"></span>Pendapatan</span>
        <span><span style="display:inline-block;width:9px;height:9px;background:var(--rust-bg);border:1px solid var(--rust);border-radius:1px;margin-right:5px;"></span>Biaya</span>
      </div>
    </div>

    <div class="panel">
      <h2>Biaya Terbesar Tahun Ini</h2>
      ${topBiaya.length===0 ? '<div class="emptynote">Belum ada data biaya.</div>' : topBiaya.map(t=>`
        <div class="rline"><span class="l">${t.name}</span><span class="v">${fmtRp(t.total)}</span></div>
      `).join('')}
    </div>
  `;
  bindYearSwitcher(viewRingkasan);
}

function renderInputRow(a){
  const vals = getVals(a.id, ui.year);
  const total = vals.reduce((s,v)=>s+(v||0),0);
  return `
    <tr>
      <td class="name">${escapeHtml(a.name)}<span class="kind kind-${a.kind}">${KIND_META[a.kind].label}</span></td>

      <td class="rowtotal num" style="text-align:right;padding:9px 8px;">${fmtNum(total)}</td>
      <td class="actions">
        <button class="btn ghost" data-action="edit-account" data-id="${a.id}" title="Ubah akun">${ICONS.edit}</button>
        <button class="btn ghost" data-action="del-account" data-id="${a.id}" title="Hapus akun">${ICONS.trash}</button>
      </td>
    </tr>
  `;
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function showEditAccountForm(id){
  const a = state.accounts.find(x=>x.id===id);

  overlay.innerHTML = `

function confirmDeleteAccount(id){
  const a = state.accounts.find(x=>x.id===id);
  if(!a) return;
  const overlay = document.createElement('div');
  overlay.className = 'modal-bg';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Hapus akun ini?</h3>
      <p>“${escapeHtml(a.name)}” beserta seluruh data bulanannya di semua tahun akan dihapus permanen.</p>
      <div class="row-actions">
        <button class="btn ghost" id="del-cancel">Batal</button>
        <button class="btn danger" id="del-confirm">Hapus</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#del-cancel').addEventListener('click', ()=> overlay.remove());
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#del-confirm').addEventListener('click', ()=>{
    state.accounts = state.accounts.filter(x=>x.id!==id);
    delete state.values[id];
    scheduleSave();
    overlay.remove();
    toast('Akun dihapus');
    viewInput();
  });
}

function periodRange(){
  if(ui.reportMode==='bulan') return [ui.month, ui.month];
  if(ui.reportMode==='ytd') return [0, ui.month];
  return [0,11]; // tahun
}
function periodLabel(){
  if(ui.reportMode==='bulan') return MONTHS_FULL(ui.month) + ' ' + ui.year;
  if(ui.reportMode==='ytd') return 'Kumulatif Jan – ' + MONTHS_FULL(ui.month) + ' ' + ui.year;
  return 'Sepanjang Tahun ' + ui.year;
}
function MONTHS_FULL(i){
  const f = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  return f[i];
}

function reportControls(){
  return `
    <div class="controls no-print">
      ${yearSwitcher()}
      <select id="month-sel">
        ${MONTHS.map((m,i)=>`<option value="${i}" ${ui.month===i?'selected':''}>${MONTHS_FULL(i)}</option>`).join('')}
      </select>
      <select id="mode-sel">
        <option value="bulan" ${ui.reportMode==='bulan'?'selected':''}>Per Bulan</option>
        <option value="ytd" ${ui.reportMode==='ytd'?'selected':''}>Kumulatif Jan–Bulan</option>
        <option value="tahun" ${ui.reportMode==='tahun'?'selected':''}>Total Setahun</option>
      </select>
    </div>
  `;
}
function bindReportControls(rerender){
  bindYearSwitcher(rerender);
  document.getElementById('month-sel').addEventListener('change', (e)=>{ ui.month = parseInt(e.target.value); rerender(); });
  document.getElementById('mode-sel').addEventListener('change', (e)=>{ ui.reportMode = e.target.value; rerender(); });
}

function viewLabaRugi(){
  const main = document.getElementById('main');
  const [f,t] = periodRange();

  const pendAccs = accountsByKind('pendapatan');
  const pendLainAccs = accountsByKind('pendapatan_lain');
  const biayaAccs = accountsByKind('biaya');
  const biayaLainAccs = accountsByKind('biaya_lain');

  const totPend = pendAccs.reduce((s,a)=>s+sumRange(a.id,ui.year,f,t),0);
  const totBiaya = biayaAccs.reduce((s,a)=>s+sumRange(a.id,ui.year,f,t),0);
  const labaUsaha = totPend - totBiaya;
  const totPendLain = pendLainAccs.reduce((s,a)=>s+sumRange(a.id,ui.year,f,t),0);
  const totBiayaLain = biayaLainAccs.reduce((s,a)=>s+sumRange(a.id,ui.year,f,t),0);
  const labaBersih = labaUsaha + totPendLain - totBiayaLain;

  function acctLines(accs){
    if(accs.length===0) return `<div class="emptynote">Belum ada akun.</div>`;
    return accs.map(a=>{
      const v = sumRange(a.id,ui.year,f,t);
      if(v===0) return '';
      return `<div class="rline"><span class="l">${escapeHtml(a.name)}</span><span class="v">${fmtRp(v)}</span></div>`;
    }).join('') || `<div class="emptynote">Tidak ada nilai pada periode ini.</div>`;
  }

  main.innerHTML = `
    <div class="sticky-head">
      <div class="topline" style="margin-bottom:14px;">
        <div><h1>Laporan Laba Rugi</h1><div class="desc">Dihasilkan otomatis dari data akun</div></div>
        ${reportControls()}
      </div>

      <div class="controls no-print" style="margin-bottom:0;">
        <button class="btn primary" id="btn-lr-export">${ICONS.download} Export Excel</button>
        <button class="btn" id="btn-lr-pdf">${ICONS.doc} Simpan sebagai PDF</button>
        <button class="btn" id="btn-lr-print">${ICONS.print} Cetak</button>
      </div>
    </div>

    <div class="panel report">
      <div class="rtitle">
        <h2>Laporan Laba Rugi</h2>
        <div class="period">${periodLabel()}</div>
      </div>

      <div class="grp">Pendapatan</div>
      ${acctLines(pendAccs)}
      <div class="rline total"><span>Total Pendapatan</span><span>${fmtRp(totPend)}</span></div>

      <div class="grp">Biaya Operasional</div>
      ${acctLines(biayaAccs)}
      <div class="rline total"><span>Total Biaya</span><span>${fmtRp(totBiaya)}</span></div>

      <div class="rline grand"><span>Laba Usaha</span><span class="v ${labaUsaha>=0?'pos':'neg'}">${fmtRp(labaUsaha)}</span></div>

      ${(pendLainAccs.length>0 || totPendLain!==0) ? `
      <div class="grp">Pendapatan Di Luar Usaha</div>
      ${acctLines(pendLainAccs)}
      <div class="rline total"><span>Total Pendapatan Di Luar Usaha</span><span>${fmtRp(totPendLain)}</span></div>
      ` : ''}

      ${(biayaLainAccs.length>0 || totBiayaLain!==0) ? `
      <div class="grp">Beban Di Luar Usaha</div>
      ${acctLines(biayaLainAccs)}
      <div class="rline total"><span>Total Beban Di Luar Usaha</span><span>${fmtRp(totBiayaLain)}</span></div>
      ` : ''}

      <div class="rline grand"><span>Laba / Rugi Bersih</span><span class="v ${labaBersih>=0?'pos':'neg'}">${fmtRp(labaBersih)}</span></div>
    </div>
  `;
  bindReportControls(viewLabaRugi);
  document.getElementById('btn-lr-export').addEventListener('click', exportLabaRugiXlsx);
  document.getElementById('btn-lr-pdf').addEventListener('click', ()=>{ toast('Pilih "Simpan sebagai PDF" pada jendela cetak'); window.print(); });
  document.getElementById('btn-lr-print').addEventListener('click', ()=> window.print());
}

function viewNeraca(){
  const main = document.getElementById('main');
  const [f,t] = periodRange();

  const kreditAccs = state.accounts.filter(a=> KIND_META[a.kind].group==='kredit');
  const debetAccs = state.accounts.filter(a=> KIND_META[a.kind].group==='debet');

  const totKredit = kreditAccs.reduce((s,a)=>s+sumRange(a.id,ui.year,f,t),0);
  const totDebetSebelumModal = debetAccs.reduce((s,a)=>s+sumRange(a.id,ui.year,f,t),0);
  const modalAkhir = totKredit - totDebetSebelumModal;
  const totDebet = totDebetSebelumModal + modalAkhir;

  function side(accs){
    const withVal = accs.map(a=>({name:a.name, v: sumRange(a.id,ui.year,f,t)})).filter(x=>x.v!==0);
    if(withVal.length===0) return `<div class="emptynote">Tidak ada akun.</div>`;
    return withVal.map(x=>`<div class="rline"><span class="l">${escapeHtml(x.name)}</span><span class="v">${fmtRp(x.v)}</span></div>`).join('');
  }

  main.innerHTML = `
    <div class="sticky-head">
      <div class="topline" style="margin-bottom:14px;">
        <div><h1>Neraca</h1><div class="desc">Posisi keuangan pada periode terpilih</div></div>
        ${reportControls()}
      </div>

      <div class="controls no-print" style="margin-bottom:0;">
        <button class="btn primary" id="btn-neraca-export">${ICONS.download} Export Excel</button>
        <button class="btn" id="btn-neraca-pdf">${ICONS.doc} Simpan sebagai PDF</button>
        <button class="btn" id="btn-neraca-print">${ICONS.print} Cetak</button>
      </div>
    </div>

    <div class="panel report" style="max-width:760px;">
      <div class="rtitle">
        <h2>Neraca Saldo</h2>
        <div class="period">Posisi per ${periodLabel()}</div>
      </div>

      <div class="neraca-cols">
        <div class="side">
          <h3>Debet</h3>
          ${side(debetAccs)}
          <div class="rline"><span class="l">Modal Akhir (Laba/Rugi Berjalan)</span><span class="v ${modalAkhir>=0?'pos':'neg'}">${fmtRp(modalAkhir)}</span></div>
          <div class="rline total"><span>Total Debet</span><span>${fmtRp(totDebet)}</span></div>
        </div>
        <div class="side">
          <h3>Kredit</h3>
          ${side(kreditAccs)}
          <div class="rline total"><span>Total Kredit</span><span>${fmtRp(totKredit)}</span></div>
        </div>
      </div>
      <div class="panel hint" style="border:none;padding:16px 0 0;margin:0;">
        Neraca dihitung otomatis: sisi Kredit menjumlahkan akun pendapatan &amp; akun neraca-kredit; sisi Debet menjumlahkan akun biaya &amp; akun neraca-debet, ditambah baris penyeimbang “Modal Akhir” yang sama dengan Laba/Rugi berjalan — sehingga kedua sisi selalu balance.
      </div>
    </div>
  `;
  bindReportControls(viewNeraca);
  document.getElementById('btn-neraca-export').addEventListener('click', exportNeracaXlsx);
  document.getElementById('btn-neraca-pdf').addEventListener('click', ()=>{ toast('Pilih "Simpan sebagai PDF" pada jendela cetak'); window.print(); });
  document.getElementById('btn-neraca-print').addEventListener('click', ()=> window.print());
}

function renderPajakRow(a){
  const vals = getVals(a.id, ui.year);
  const total = vals.reduce((s,v)=>s+(v||0),0);
  return `
    <tr>
      <td class="name">${escapeHtml(a.name)}</td>
      ${vals.map((v,m)=>`<td><input class="cell" type="text" inputmode="numeric" data-acc="${a.id}" data-m="${m}" value="${v?fmtNum(v):''}" placeholder="0"></td>`).join('')}
      <td class="rowtotal num" style="text-align:right;padding:9px 8px;">${fmtNum(total)}</td>
    </tr>
  `;
}

function buildPajakRows(type){
  const meta = PAJAK_META[type];
  const accs = taxAccounts(type);
  const rows = [[('LAPORAN ' + meta.label).toUpperCase(), 'Tahun ' + ui.year], []];
  rows.push(['Akun', ...MONTHS, 'Total']);
  accs.forEach(a=>{
    const vals = getVals(a.id, ui.year);
    rows.push([a.name, ...vals, vals.reduce((s,v)=>s+(v||0),0)]);
  });
  const colTotals = new Array(12).fill(0);
  accs.forEach(a=>{ const v = getVals(a.id, ui.year); for(let m=0;m<12;m++) colTotals[m]+=v[m]||0; });
  rows.push(['Total', ...colTotals, colTotals.reduce((s,v)=>s+v,0)]);
  return rows;
}

function exportPajakXlsx(type){
  const meta = PAJAK_META[type];
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(buildPajakRows(type));
  ws['!cols'] = [{wch:30}, ...MONTHS.map(()=>({wch:13})), {wch:15}];
  XLSX.utils.book_append_sheet(wb, ws, meta.label.slice(0,31));
  XLSX.writeFile(wb, `Laporan-${meta.label.replace(/\s+/g,'-')}-${ui.year}.xlsx`);
  toast('File Excel diunduh');
}

  document.getElementById('btn-clear-all').addEventListener('click', confirmClearAll);
}

function buildLabaRugiRows(){
  const [f,t] = periodRange();
  const rows = [['LAPORAN LABA RUGI', periodLabel()], []];
  rows.push(['PENDAPATAN']);
  accountsByKind('pendapatan').forEach(a=> rows.push([a.name, sumRange(a.id,ui.year,f,t)]));
  rows.push(['Total Pendapatan', kindTotal('pendapatan',ui.year,f,t)]);
  rows.push([]);
  rows.push(['BIAYA OPERASIONAL']);
  accountsByKind('biaya').forEach(a=> rows.push([a.name, sumRange(a.id,ui.year,f,t)]));
  rows.push(['Total Biaya', kindTotal('biaya',ui.year,f,t)]);
  rows.push([]);
  const labaUsaha = kindTotal('pendapatan',ui.year,f,t) - kindTotal('biaya',ui.year,f,t);
  rows.push(['LABA USAHA', labaUsaha]);
  const totPendLain = kindTotal('pendapatan_lain',ui.year,f,t);
  const totBiayaLain = kindTotal('biaya_lain',ui.year,f,t);
  rows.push([]);
  rows.push(['Pendapatan Di Luar Usaha', totPendLain]);
  rows.push(['Beban Di Luar Usaha', totBiayaLain]);
  rows.push([]);
  rows.push(['LABA / RUGI BERSIH', labaUsaha + totPendLain - totBiayaLain]);
  return rows;
}

function buildNeracaRows(){
  const [f,t] = periodRange();
  const kreditAccs = state.accounts.filter(a=> KIND_META[a.kind].group==='kredit');
  const debetAccs = state.accounts.filter(a=> KIND_META[a.kind].group==='debet');
  const totKredit = kreditAccs.reduce((s,a)=>s+sumRange(a.id,ui.year,f,t),0);
  const totDebetSebelumModal = debetAccs.reduce((s,a)=>s+sumRange(a.id,ui.year,f,t),0);
  const modalAkhir = totKredit - totDebetSebelumModal;
  const rows = [['NERACA SALDO', periodLabel()], [], ['Deskripsi','Debet','Kredit']];
  debetAccs.forEach(a=>{ const v = sumRange(a.id,ui.year,f,t); if(v!==0) rows.push([a.name, v, '']); });
  kreditAccs.forEach(a=>{ const v = sumRange(a.id,ui.year,f,t); if(v!==0) rows.push([a.name, '', v]); });
  rows.push(['Modal Akhir (Laba/Rugi Berjalan)', modalAkhir, '']);
  rows.push(['TOTAL', totDebetSebelumModal+modalAkhir, totKredit]);
  return rows;
}

function exportXlsx(){
  const wb = XLSX.utils.book_new();

  // Sheet 1: Rekap
  const header = ['Akun','Jenis', ...MONTHS.map(m=>m.toUpperCase()), 'TOTAL'];
  const rows = [header];
  state.accounts.forEach(a=>{
    const vals = getVals(a.id, ui.year);
    rows.push([a.name, KIND_META[a.kind].label, ...vals, vals.reduce((s,v)=>s+v,0)]);
  });
  const ws1 = XLSX.utils.aoa_to_sheet(rows);
  XLSX.utils.book_append_sheet(wb, ws1, 'Rekap ' + ui.year);

  // Sheet 2: Laba Rugi (current mode/period)
  const ws2 = XLSX.utils.aoa_to_sheet(buildLabaRugiRows());
  XLSX.utils.book_append_sheet(wb, ws2, 'Laba Rugi');

  // Sheet 3: Neraca
  const ws3 = XLSX.utils.aoa_to_sheet(buildNeracaRows());
  XLSX.utils.book_append_sheet(wb, ws3, 'Neraca');

  XLSX.writeFile(wb, `Laba-Rugi-Neraca-${ui.year}.xlsx`);
  toast('File Excel diunduh');
}

function exportLabaRugiXlsx(){
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(buildLabaRugiRows());
  ws['!cols'] = [{wch:34},{wch:16}];
  XLSX.utils.book_append_sheet(wb, ws, 'Laba Rugi');

function exportNeracaXlsx(){

function handleImportXlsx(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const wb = XLSX.read(ev.target.result, {type:'binary'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:null});

      // find header row containing month abbreviations
      let headerIdx = -1, monthCols = [];
      for(let i=0;i<rows.length;i++){
        const row = rows[i] || [];
        const found = row.map((c,ci)=> ({ci, c: (c||'').toString().toUpperCase().trim()}))
          .filter(x=> ['JAN','FEB','MAR','APR','MEI','MAY','JUN','JUL','AGT','AUG','SEP','OKT','OCT','NOV','DES','DEC'].includes(x.c));
        if(found.length>=6){ headerIdx = i; monthCols = found.map(x=>x.ci); break; }
      }
      if(headerIdx===-1){ toast('Format tidak dikenali: header bulan tidak ditemukan'); e.target.value=''; return; }
      monthCols = monthCols.slice(0,12);

      let added=0, updated=0;
      for(let i=headerIdx+1;i<rows.length;i++){
        const row = rows[i] || [];
        const name = (row[0]||'').toString().trim();
        if(!name) continue;
        const skipPattern = /^total|^rangkuman|^pengeluaran per\s*bulan$|^l\s*\/\s*r(\s*per\s*bulan)?$|^pendapatan\s+\d{4}$/i;
        if(skipPattern.test(name.trim())) continue;
        const vals = monthCols.map(ci=>{
          const raw = row[ci];
          const n = typeof raw === 'number' ? raw : parseNum(raw);
          return n||0;
        });
        while(vals.length<12) vals.push(0);

        let acc = state.accounts.find(a=>a.name.toLowerCase()===name.toLowerCase());
        if(!acc){
          const kind = /pendapat/i.test(name) ? 'pendapatan' : 'biaya';
          acc = {id: uid(), name, kind};
          state.accounts.push(acc);
          added++;
        } else {
          updated++;
        }
        state.values[acc.id] = state.values[acc.id] || {};
        state.values[acc.id][ui.year] = vals;
      }
      scheduleSave();
      toast(`Impor selesai: ${added} akun baru, ${updated} akun diperbarui`);
      render();
    }catch(err){
      console.error(err);
      toast('Gagal membaca file Excel');
    }
  };
  reader.readAsBinaryString(file);
  e.target.value = '';
}

function showShell(show){
  document.getElementById('login-screen').style.display = show ? 'none' : 'flex';
  document.getElementById('shell').style.display = show ? 'flex' : 'none';
}

function renderLoginScreen(hasAccount, errorMsg){
  const wrap = document.getElementById('login-screen');
  wrap.style.display = 'flex';
  document.getElementById('shell').style.display = 'none';

  if(hasAccount){
    wrap.innerHTML = `
      <div class="login-card">
        <div class="login-badge"><img src="icon-512.png" alt="Laporan Keuangan Dini"></div>
        <div class="login-title">Laporan Dini</div>
        <div class="login-sub">Masuk untuk mengelola laporan laba rugi dan neraca</div>
        <div class="login-form">
          <div class="login-error ${errorMsg?'show':''}" id="login-err">${errorMsg||''}</div>
          <div>
            <label>Username</label>
            <input type="text" id="li-user" autocomplete="username" placeholder="Masukkan username">
          </div>
          <div>
            <label>Kata Sandi</label>
            <input type="password" id="li-pass" autocomplete="current-password" placeholder="Masukkan kata sandi">
          </div>
          <button class="btn primary" id="li-submit">Masuk</button>
        </div>
        <div class="login-switch">Lupa kata sandi? <a id="li-reset">Buat ulang akun</a></div>
        <div class="login-foot">Laporan Keuangan Dini. Software Developer by Adi Nugraha &copy; 2026</div>
      </div>
    `;
    const submit = async ()=>{
      const u = document.getElementById('li-user').value.trim();
      const p = document.getElementById('li-pass').value;
      const match = await findAuthUser(u, p);
      if(match){
        session.loggedIn = true;
        session.username = match.username;
        startApp();
      } else {
        renderLoginScreen(true, 'Username atau kata sandi salah.');
      }
    };
    document.getElementById('li-submit').addEventListener('click', submit);
    wrap.querySelectorAll('input').forEach(inp=> inp.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); }));
    document.getElementById('li-reset').addEventListener('click', ()=> renderSetupScreen(true));
  } else {
    renderSetupScreen(false);
  }
}

function renderSetupScreen(isReset){
  const wrap = document.getElementById('login-screen');
  wrap.style.display = 'flex';
  document.getElementById('shell').style.display = 'none';
  wrap.innerHTML = `
    <div class="login-card">
      <div class="login-badge"><img src="icon-512.png" alt="Laporan Keuangan Dini"></div>
      <div class="login-title">Laporan Dini</div>
      <div class="login-sub">${isReset ? 'Buat ulang username dan kata sandi baru (akun lain sebelumnya akan terhapus)' : 'Buat akun pertama untuk mulai menggunakan aplikasi'}</div>
      <div class="login-form">
        <div class="login-error" id="setup-err"></div>
        <div>
          <label>Username</label>
          <input type="text" id="su-user" autocomplete="username" placeholder="Buat username">
        </div>
        <div>
          <label>Kata Sandi</label>
          <input type="password" id="su-pass" autocomplete="new-password" placeholder="Buat kata sandi (min. 4 karakter)">
        </div>
        <div>
          <label>Ulangi Kata Sandi</label>
          <input type="password" id="su-pass2" autocomplete="new-password" placeholder="Ulangi kata sandi">
        </div>
        <button class="btn primary" id="su-submit">${isReset?'Simpan Akun Baru':'Buat Akun'}</button>
      </div>
      ${isReset ? `<div class="login-switch">Sudah ingat kata sandi? <a id="su-back">Kembali ke halaman masuk</a></div>` : `<div class="login-switch">Setelah masuk, akun tambahan (mis. untuk rekan Anda) bisa dibuat lewat menu Import / Export.</div>`}
      <div class="login-foot">Laporan Keuangan Dini. Software Developer by Adi Nugraha &copy; 2026</div>
    </div>
  `;
  const showErr = (msg)=>{ const el=document.getElementById('setup-err'); el.textContent=msg; el.classList.add('show'); };
  document.getElementById('su-submit').addEventListener('click', async ()=>{
    const u = document.getElementById('su-user').value.trim();
    const p = document.getElementById('su-pass').value;
    const p2 = document.getElementById('su-pass2').value;
    if(!u){ showErr('Username tidak boleh kosong.'); return; }
    if(p.length<4){ showErr('Kata sandi minimal 4 karakter.'); return; }
    if(p!==p2){ showErr('Kata sandi tidak sama.'); return; }
    const hash = await sha256Hex(p);
    await saveAuthList([{username:u, hash}]);
    session.loggedIn = true;
    session.username = u;
    startApp();
  });
  if(isReset){
    document.getElementById('su-back').addEventListener('click', async ()=>{
      const list = await loadAuthList();
      renderLoginScreen(list.length>0);
    });
  }
}

async function startApp(){
  showShell(true);
  const loaded = await loadState();
  if(loaded){
    state = loaded;
    if(!state.sptBadan) state.sptBadan = {};
    const ys = yearsAvailable();
    ui.year = ys.length ? ys[ys.length-1] : new Date().getFullYear();
  } else {
    state = seedState();
    ui.year = 2025;
  }
  render();
}

/* =========================================================
   RENDER ROOT
   ========================================================= */
function render(){
  renderNav();
  const logoutBtn = document.getElementById('btn-logout');
  if(logoutBtn) logoutBtn.onclick = ()=>{ session.loggedIn = false; renderLoginScreen(true); };
  const manageUsersBtn = document.getElementById('btn-manage-users');
  if(manageUsersBtn) manageUsersBtn.onclick = showManageUsersModal;
  const mbMoreBtn = document.getElementById('mb-more');
  if(mbMoreBtn) mbMoreBtn.onclick = showMobileMoreSheet;
  if(ui.view==='ringkasan') viewRingkasan();
  else if(ui.view==='input') viewInput();
  else if(ui.view==='labarugi') viewLabaRugi();
  else if(ui.view==='neraca') viewNeraca();
  else if(ui.view==='pajak') viewPajak();
  else if(ui.view==='io') viewIO();
}

async function init(){
  const list = await loadAuthList();
  renderLoginScreen(list.length>0);
}
init();
